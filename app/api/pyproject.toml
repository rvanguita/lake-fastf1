[project]
name = "f1-api-driver-champion"
version = "0.1.0"
description = "F1 Driver Champion Predictor — FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mlflow>=3.15.1",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "psutil>=6.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "skops>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

