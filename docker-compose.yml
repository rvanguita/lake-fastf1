services:
  airflow:
    user: "${AIRFLOW_UID:-50000}:0"
    build:
      context: .
      dockerfile: Dockerfile
    command: standalone
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      AIRFLOW_HOME: /opt/airflow/project/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    working_dir: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
    restart: unless-stopped
  api-driver-champion:
    build:
      context: ./app/api/
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      ./.env
    restart:  unless-stopped
  streamlit:
    build:
      context: ./app/streamlit/
      dockerfile: Dockerfile
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      LAKE_ROOT: "/data"
      API_URL: "http://api-driver-champion:5002"
    volumes:
      - ./data:/data:ro
    env_file:
      ./.env
    restart: unless-stopped
    depends_on:
      - "api-driver-champion"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  dash:
    build:
      context: ./app/dash/
    ports:
      - "${DASH_PORT:-8050}:8050"
    environment:
      TABLE_PATH_BRONZE: "/data/bronze/results"
      TABLE_PATH_SILVER: "/data/silver/tb_abt"
      API_URL: "http://api-driver-champion:5002"
    volumes:
      - ./data/bronze/results:/data/bronze/results:ro
      - ./data/silver/tb_abt:/data/silver/tb_abt:ro
    restart: unless-stopped
    depends_on:
      - api-driver-champion
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
